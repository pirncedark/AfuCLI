name: AFU Windows release

on:
  push:
    tags: ['afu-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-12
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Resolve release tag
        id: release
        run: |
          $version = (Get-Content packages/coding-agent/package.json -Raw | ConvertFrom-Json).version
          $tag = "afu-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Release tag must match the package version.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: bun install --frozen-lockfile
      - name: Build baseline and modern native addons
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: |
          bun packages/natives/scripts/build-bindings.ts --variant baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline addon build failed.' }
          bun packages/natives/scripts/build-bindings.ts --variant modern
          if ($LASTEXITCODE -ne 0) { throw 'Modern addon build failed.' }
      - name: Compile standalone AFU
        run: bun run ci:release:build-binaries --targets win32-x64 --afu
      - name: Verify version and worker smoke test
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $exe = '.\packages\coding-agent\binaries\afu-windows-x64.exe'
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "afu/$env:EXPECTED_VERSION") { throw 'Unexpected AFU version.' }
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'AFU smoke test failed.' }
          $env:PI_NATIVE_VARIANT = 'baseline'
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'AFU baseline smoke test failed.' }
          $env:PI_NATIVE_VARIANT = 'modern'
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'AFU modern smoke test failed.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$exe.sha256", "$hash  afu-windows-x64.exe`n", [Text.Encoding]::ASCII)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AFU ${{ steps.release.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            packages/coding-agent/binaries/afu-windows-x64.exe
            packages/coding-agent/binaries/afu-windows-x64.exe.sha256
